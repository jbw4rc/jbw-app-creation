[project]
name = "ho-rating"
version = "0.1.0"
description = "Homeowners rating engine prototype: declarative carrier plans, one generic interpreter."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
