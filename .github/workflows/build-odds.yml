# Poll The Odds API and commit a snapshot of the NFL board. The accumulated
# snapshots in src/nfl/data/oddsHistory.ts are the app's line-movement history.
#
# NO CRON. Polls are triggered on demand only: the scheduled Claude Routines
# (weekday 10am/5pm ET, Sunday morning, the pre-kickoff closes, SNF), the
# site's Refresh button, or a manual run. GitHub's own `schedule` trigger used
# to run here as well, but it fires hours late (a 10am slot landed after 2pm)
# and on top of the Routines it doubled the spend: the free tier is 500
# credits/month at 4 per poll, and the duplicate slots burned through it with
# ten days of the month left. One scheduler, and it is the one that runs on time.
name: Build NFL odds

on:
  workflow_dispatch:

permissions:
  contents: write

# The site's refresh button and a scheduled check-in can land
# at once. Queue them instead of running two polls that race to push, and
# never cancel one mid-way: the credits are already spent by then.
concurrency:
  group: build-odds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Poll The Odds API
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/build-odds.mjs
      # Grade and retire finished games. Must run after every poll: it is what
      # keeps the live history bounded, and a game dropped before it is graded
      # is gone for good.
      - name: Archive finished games
        run: npx tsx scripts/archive-odds.ts
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/nfl/data/oddsHistory.ts src/nfl/data/clvArchive.ts
          if git diff --staged --quiet; then
            echo "No odds changes."
          else
            git commit -m "Update NFL odds snapshot and CLV archive"
            git pull --rebase --autostash || true
            git push || (git pull --rebase --autostash && git push)
          fi
