name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The odds poller commits to main, but GitHub deliberately does NOT trigger
  # workflows from pushes made with GITHUB_TOKEN — it is loop prevention. That
  # meant every snapshot landed in the repo and the published page never
  # rebuilt: the data moved for hours while the site sat frozen on an old
  # build. workflow_run is not suppressed the same way, so the deploy hangs off
  # the poller finishing instead of off its push.
  workflow_run:
    workflows: ["Build NFL odds"]
    types: [completed]
  workflow_dispatch:

# Allow the workflow token to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let a newer push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # On workflow_run, only publish when the poll actually succeeded; a failed
    # poll has nothing new to show.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run checks out the default branch by default, but be explicit
      # so the build always picks up the snapshot the poller just committed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Enables Pages (build type = GitHub Actions) on the first run via the API.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
