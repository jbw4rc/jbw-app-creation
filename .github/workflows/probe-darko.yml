# One-off, read-only diagnostic: report how darko.app serves its data. Commits nothing.
name: Probe DARKO

on:
  workflow_dispatch:
  push:
    branches: [claude/nba-roster-apron-analyzer-u6oonq]
    paths:
      - 'scripts/probe-darko.mjs'
      - '.github/workflows/probe-darko.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe darko.app
        run: node scripts/probe-darko.mjs
